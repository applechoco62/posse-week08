<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>チームメンバー一覧ページ</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-pink-500">
        <h1 class="text-2xl font-bold mb-6 text-center text-white">チームメンバー👠</h1>
        <div id="memberList" class="grid gap-4"></div>
        
        <script>
            const members = [
                { name: "アンディ", role: "助手", comment: "記者志望だがファッション部門に所属" },
                { name: "ミランダ", role: "編集長", comment: "ファッション界に絶大な影響力を持つ" },
                { name: "アレックス", role: "アンディの恋人", comment: "アンディとのすれ違いを感じている" }
            ];

            const memberList = document.getElementById('memberList');

            members.forEach((member) => {
                const card = document.createElement("div");
                card.className = "bg-white p-4 rounded-lg shadow mx-8";

                card.innerHTML = `
                    <h2 class="text-lg font-bold">${member.name}</h2>
                    <p class="text-gray-600">${member.role}</p>
                    <p class="text-gray-500">${member.comment}</p>
                `;
                memberList.appendChild(card);
            });ß
        </script>
    </body>
</html>
